name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build and release Windows app
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Compute version
        id: version
        shell: pwsh
        run: |
          $version = "0.1.${{ github.run_number }}"
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=v$version" >> $env:GITHUB_OUTPUT

      - name: Test
        shell: pwsh
        run: dotnet test ReadTray.slnx -c Release

      - name: Restore packaging tools
        shell: pwsh
        run: dotnet tool restore

      - name: Package Velopack installer
        id: package
        shell: pwsh
        run: ./scripts/package-velopack.ps1 -Configuration Release -Runtime win-x64 -Version '${{ steps.version.outputs.version }}'

      - name: Create GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = '${{ steps.version.outputs.tag }}'
          $title = "ReadTray ${{ steps.version.outputs.version }}"
          $notes = @"
          Automated ReadTray release from main.

          Install:
          1. Download ReadTray-win-Setup.exe.
          2. Run the installer.

          The attached Velopack release assets are used by the in-app updater.
          "@
          gh release create $tag `
            artifacts/velopack/* `
            --title $title `
            --notes $notes `
            --latest
